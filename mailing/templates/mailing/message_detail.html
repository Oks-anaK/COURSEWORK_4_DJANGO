{% extends 'mailing/base.html' %}
{% load my_tags %}
{% block content %}
<div class="album py-5 bg-body-tertiary">
    <div class="container">
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
            <div class="col">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <p class="card-text">Тема: {{ object.subject }}</p>
                        <p class="card-text">{{ object.body }}</p>
                        <div class="d-flex justify-content-between align-items-center">
                            {% if object.owner == user %}
                            <div class="btn-group">
                                <a class="btn btn-primary" href="{% url 'mailing:message_update' object.pk %}"
                                   role="button">Редактировать</a>
                            </div>
                            {% endif %}
                            {% if object.owner == user %}
                            <div class="btn-group">
                                <a class="btn btn-danger" href="{% url 'mailing:message_delete' object.pk %}"
                                   role="button">Удалить</a>
                            </div>
                            {% endif %}
                            <div class="btn-group">
                                <a class="btn btn-primary" href="{% url 'mailing:message_list' %}"
                                   role="button">Назад</a>
                            </div>
                            <small class="text-body-secondary"></small></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
