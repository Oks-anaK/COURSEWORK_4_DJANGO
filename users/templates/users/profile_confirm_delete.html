{% extends 'mailing/base.html' %}
{% block content %}
<div class="container">
    <div class="row">
        <div class="col-8">
            {% if object.owner == user %}
            <form class="row" method="post" enctype="multipart/form-data">
                <div class="card">
                    <p class="card-text">Вы действительно хотите удалить {{ object.email }}?</p>
                    <div class="card-body">
                        {% csrf_token %}
                    </div>
                    <div class="btn-group" role="group" aria-label="Basic mixed styles">
                        <button type="submit" class="btn btn-danger">Удалить</button>
                        <a class="btn btn-light" href="{% url 'mailing:profile' %}"
                           role="button">Отменить</a>
                    </div>
                </div>
            </form>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
