{% extends 'mailing/base.html' %}
{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h2>
                        {% if object %}
                            Редактирование профиля
                        {% else %}
                            Регистрация
                        {% endif %}
                    </h2>
                </div>
                <div class="card-body">
                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn btn-primary">
                            {% if object %}
                                Сохранить изменения
                            {% else %}
                                Зарегистрироваться
                            {% endif %}
                        </button>
                        {% if object %}
                            <a href="{% url 'users:profile' %}" class="btn btn-secondary">Отмена</a>
                        {% else %}
                            <a href="{% url 'users:login' %}" class="btn btn-secondary">Отмена</a>
                        {% endif %}
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
