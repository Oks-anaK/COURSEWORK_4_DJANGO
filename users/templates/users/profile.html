{% extends 'mailing/base.html' %}
{% load my_tags %}
{% block content %}
<div class="album py-5 bg-body-tertiary">
    <div class="container">
      <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
        <div class="col">
          <div class="card shadow-sm">
            <img src="{{ object.avatar | media_filter }}" class="img-fluid">
            <div class="card-body">
              <p class="card-text">{{ object.email }}</p>
              <p class="card-text">{{ object.first_name }}</p>
              <p class="card-text">{{ object.last_name }}</p>
              <div class="d-flex justify-content-between align-items-center">
                <div class="btn-group">
                  <a class="btn btn-primary" href="{% url 'users:profile-edit' %}" role="button">Редактировать профиль</a>
                  <a class="btn btn-light" href="{% url 'mailing:mailing_list' %}" role="button">Назад</a>
                </div>
                <small class="text-body-secondary"></small></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
