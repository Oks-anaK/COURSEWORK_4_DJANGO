{% extends 'mailing/base.html' %}
{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h2>
                        {% if 'confirm' in request.path %}
                            Введите новый пароль
                        {% else %}
                            Восстановление пароля
                        {% endif %}
                    </h2>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn btn-primary">
                            {% if 'confirm' in request.path %}
                                Сохранить пароль
                            {% else %}
                                Отправить
                            {% endif %}
                        </button>
                    </form>
                    {% if 'confirm' not in request.path %}
                    <div class="mt-3">
                        <a href="{% url 'users:login' %}">Вернуться к входу</a>
                    </div>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
