{% extends 'mailing/base.html' %}
{% block content %}
<div class="container">
    <div class="row">
        <div class="col-8">
            <div class="card" style="background-color: #e3f2fd;">
                <div class="card-body">
                    <h2 class="card-title">Email успешно подтвержден!</h2>
                    <p class="card-text">
                        Ваш email адрес был успешно подтвержден. Теперь вы можете войти в систему.
                    </p>
                    <a href="{% url 'users:login' %}" class="btn btn-primary">Войти</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
